apiVersion: apps/v1
kind: Deployment
metadata:
  name: sellers-api
  namespace: mercaandes-sellers
  labels:
    app.kubernetes.io/name: sellers-api
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: mercaandes-platform
    app.kubernetes.io/managed-by: terraform-k8s
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sellers-api
  template:
    metadata:
      labels:
        app: sellers-api
        app.kubernetes.io/name: sellers-api
        app.kubernetes.io/component: api-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sellers-api
          image: api-sellers:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sellers-api-config
            - secretRef:
                name: sellers-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
