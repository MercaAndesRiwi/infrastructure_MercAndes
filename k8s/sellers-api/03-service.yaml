apiVersion: v1
kind: Service
metadata:
  name: sellers-api-service
  namespace: mercaandes-sellers
  labels:
    app.kubernetes.io/name: sellers-api
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: sellers-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
# LoadBalancer Service alternative for external ingress testing during PoC evaluation
apiVersion: v1
kind: Service
metadata:
  name: sellers-api-lb
  namespace: mercaandes-sellers
  labels:
    app.kubernetes.io/name: sellers-api
    app.kubernetes.io/component: public-lb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: sellers-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
