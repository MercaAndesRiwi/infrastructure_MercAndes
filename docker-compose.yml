services:
  postgres:
    image: postgres:16
    container_name: platform-postgres
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POS_DB_NAME}
      POSTGRES_USER: ${POS_DB_USER}
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD}
    ports: ["${POS_DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POS_DB_USER} -d $${POS_DB_NAME}"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: platform-rabbitmq
    env_file: [.env]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MGMT_PORT:-15672}:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: platform-kafka
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
    volumes: [kafka-data:/var/lib/kafka/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-mercaandes.orders.events}
      KAFKA_ORDERS_PARTITIONS: ${KAFKA_ORDERS_PARTITIONS:-3}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
    volumes:
      - ./scripts/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  kafka-ui:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: platform-kafka-ui
    ports: ["${KAFKA_UI_PORT:-9000}:9000"]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on: [kafka]
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.1
    container_name: platform-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["${SPARK_MASTER_UI_PORT:-8081}:8080", "7077:7077"]
    volumes:
      - spark-work:/opt/spark/work
      - ../MercaAndes_Spark_Gold_Transformations:/opt/mercaandes:ro
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.1
    container_name: platform-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker -m ${SPARK_WORKER_MEMORY:-1G} -c ${SPARK_WORKER_CORES:-1} spark://spark-master:7077
    depends_on: [spark-master]
    volumes:
      - ../MercaAndes_Spark_Gold_Transformations:/opt/mercaandes:ro
    restart: unless-stopped

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-init
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
    command: version
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  airflow-apiserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-api
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      S3_DATA_LAKE_BUCKET_NAME: ${S3_DATA_LAKE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      F7_WEEKLY_PROMOTIONS_LOCAL_INPUT_PATH: /opt/inputs/f7_promotions
      F1_KAGGLE_LOCAL_INPUT_PATH: /opt/inputs/f1_kaggle
      AIRFLOW_CONN_POS_DB: "postgresql+psycopg2://${POS_DB_USER:-pos_user}:${POS_DB_PASSWORD}@${POS_DB_HOST:-postgres}:${POS_DB_PORT:-5432}/${POS_DB_NAME:-merca_pos}"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
      - ./inputs/f1_kaggle:/opt/inputs/f1_kaggle:ro
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    command: api-server
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-scheduler
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
      S3_DATA_LAKE_BUCKET_NAME: ${S3_DATA_LAKE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      F7_WEEKLY_PROMOTIONS_LOCAL_INPUT_PATH: /opt/inputs/f7_promotions
      F1_KAGGLE_LOCAL_INPUT_PATH: /opt/inputs/f1_kaggle
      AIRFLOW_CONN_POS_DB: "postgresql+psycopg2://${POS_DB_USER:-pos_user}:${POS_DB_PASSWORD}@${POS_DB_HOST:-postgres}:${POS_DB_PORT:-5432}/${POS_DB_NAME:-merca_pos}"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
      - ./inputs/f1_kaggle:/opt/inputs/f1_kaggle:ro
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-dag-processor:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-dag-processor
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
      - ./inputs/f1_kaggle:/opt/inputs/f1_kaggle:ro
    command: dag-processor
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-worker-1:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-worker-1
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      S3_DATA_LAKE_BUCKET_NAME: ${S3_DATA_LAKE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      F7_WEEKLY_PROMOTIONS_LOCAL_INPUT_PATH: /opt/inputs/f7_promotions
      F1_KAGGLE_LOCAL_INPUT_PATH: /opt/inputs/f1_kaggle
      AIRFLOW_CONN_POS_DB: "postgresql+psycopg2://${POS_DB_USER:-pos_user}:${POS_DB_PASSWORD}@${POS_DB_HOST:-postgres}:${POS_DB_PORT:-5432}/${POS_DB_NAME:-merca_pos}"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
      - ./inputs/f1_kaggle:/opt/inputs/f1_kaggle:ro
    command: celery worker
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-worker-2:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-worker-2
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      S3_DATA_LAKE_BUCKET_NAME: ${S3_DATA_LAKE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      F7_WEEKLY_PROMOTIONS_LOCAL_INPUT_PATH: /opt/inputs/f7_promotions
      F1_KAGGLE_LOCAL_INPUT_PATH: /opt/inputs/f1_kaggle
      AIRFLOW_CONN_POS_DB: "postgresql+psycopg2://${POS_DB_USER:-pos_user}:${POS_DB_PASSWORD}@${POS_DB_HOST:-postgres}:${POS_DB_PORT:-5432}/${POS_DB_NAME:-merca_pos}"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-apache-spark apache-airflow-providers-postgres pika boto3 pandas openpyxl}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services/operational-messaging/src/operational_messaging:/opt/airflow/dags/operational_messaging:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
      - ./inputs/f1_kaggle:/opt/inputs/f1_kaggle:ro
    command: celery worker
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-flower:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-flower
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    ports: ["${AIRFLOW_FLOWER_PORT:-5555}:5555"]
    command: celery flower
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  pos-database:
    build:
      context: ../Transactional-POS-database
      dockerfile: Dockerfile
    container_name: platform-pos-database
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POS_DB_USER:-pos_user}:${POS_DB_PASSWORD}@postgres:5432/${POS_DB_NAME:-merca_pos}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-1000}
      SEED_SALES_PER_COUNTRY: ${SEED_SALES_PER_COUNTRY:-100}
      SEED_RANDOM: ${SEED_RANDOM:-42}
      SEED_START_DATE: ${SEED_START_DATE:-2025-01-01}
      SEED_END_DATE: ${SEED_END_DATE:-2025-12-31}
      SEED_BATCH_SIZE: ${SEED_BATCH_SIZE:-2000}
    command: ["sh", "-c", "alembic upgrade head && python -m transactional_pos.presentation.cli.seed_all"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  exchange-rates-seed:
    build:
      context: ../api-exchange-rates
      dockerfile: Dockerfile
    container_name: platform-exchange-rates
    env_file: [.env]
    environment:
      POS_DB_HOST: postgres
      POS_DB_PORT: "5432"
      POS_DB_NAME: "${POS_DB_NAME}"
      POS_DB_USER: "${POS_DB_USER}"
      POS_DB_PASSWORD: "${POS_DB_PASSWORD}"
      API_URL: "https://api.frankfurter.dev/v2/rates"
      START_DATE: "${EXCHANGE_START_DATE:-2025-01-01}"
      END_DATE: "${EXCHANGE_END_DATE:-2026-12-31}"
      TARGET_CURRENCIES: "${TARGET_CURRENCIES:-COP,PEN,BOB,CLP}"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  holidays-seed:
    build:
      context: ../api-holidays
      dockerfile: Dockerfile
    container_name: platform-holidays
    env_file: [.env]
    environment:
      POS_DB_HOST: postgres
      POS_DB_PORT: "5432"
      POS_DB_NAME: "${POS_DB_NAME}"
      POS_DB_USER: "${POS_DB_USER}"
      POS_DB_PASSWORD: "${POS_DB_PASSWORD}"
      API_URL: "https://nagerholidays.com/api/v4/Holidays"
      YEARS: "${HOLIDAYS_YEARS:-2025,2026}"
      COUNTRY_CODES: "${COUNTRY_CODES:-CO,PE,EC,BO,CL}"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  inventory-api:
    build:
      context: ../Inventory_Api
      dockerfile: Dockerfile
    container_name: platform-inventory-api
    env_file: [.env]
    environment:
      POS_DB_HOST: postgres
      POS_DB_PORT: "5432"
      POS_DB_NAME: "${POS_DB_NAME}"
      POS_DB_USER: "${POS_DB_USER}"
      POS_DB_PASSWORD: "${POS_DB_PASSWORD}"
      MASTER_SEED: "${MASTER_SEED:-42}"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    ports: ["${INVENTORY_API_PORT:-8002}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  marketplace-api:
    build:
      context: ../Marketplace_Api
      dockerfile: Dockerfile
    container_name: platform-marketplace-api
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_TOPIC_ORDERS: "${KAFKA_TOPIC_ORDERS:-mercaandes.orders.events}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      MASTER_SEED: "${MASTER_SEED:-42}"
    ports: ["${MARKETPLACE_API_PORT:-8003}:8000"]
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  f7-weekly-promotions:
    build: ./services/f7-weekly-promotions
    container_name: platform-f7-weekly-promotions
    env_file: [.env]
    environment:
      S3_DATA_LAKE_BUCKET_NAME: ${S3_DATA_LAKE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_PROMOTIONS_WEEKLY: ${KAFKA_TOPIC_PROMOTIONS_WEEKLY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE_PROMOTIONS_WEEKLY_INGEST: ${RABBITMQ_QUEUE_PROMOTIONS_WEEKLY_INGEST}
      F7_WEEKLY_PROMOTIONS_LOCAL_INPUT_PATH: /opt/inputs/f7_promotions
    ports: ["${F7_WEEKLY_PROMOTIONS_API_PORT:-8004}:8000"]
    volumes:
      - ./inputs/f7_promotions:/opt/inputs/f7_promotions:ro
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  notification-worker:
    build: ./services/notification-worker
    container_name: platform-notification-worker
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
      RABBITMQ_QUEUE_PURCHASE_NOTIFICATIONS: "${RABBITMQ_QUEUE_PURCHASE_NOTIFICATIONS:-mercaandes.notifications.purchase}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      EMAIL_FROM: "${EMAIL_FROM:-atencion@mercaandes.com}"
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  operational-alerts-worker:
    build: ./services/operational-messaging
    container_name: platform-operational-alerts-worker
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
      ALERT_LOG_PATH: /app/alerts/processed.jsonl
    volumes:
      - alerts-data:/app/alerts
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  reports-api:
    build: ./services/operational-messaging
    container_name: platform-reports-api
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
    ports: ["${REPORTS_API_PORT:-8005}:8000"]
    command: ["uvicorn", "operational_messaging.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  reports-worker:
    build: ./services/operational-messaging
    container_name: platform-reports-worker
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "${RABBITMQ_PORT:-5672}"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-/}"
      POS_DB_HOST: postgres
      POS_DB_PORT: "5432"
      POS_DB_NAME: "${POS_DB_NAME}"
      POS_DB_USER: "${POS_DB_USER}"
      POS_DB_PASSWORD: "${POS_DB_PASSWORD}"
      REPORTS_OUTPUT_DIR: /app/reports
    volumes:
      - reports-data:/app/reports
    command: ["python", "-m", "operational_messaging.reports"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  rabbit-data:
  kafka-data:
  spark-work:
  alerts-data:
  reports-data:
