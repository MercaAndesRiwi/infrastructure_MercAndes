services:
  postgres:
    image: postgres:16
    container_name: platform-postgres
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POS_DB_NAME}
      POSTGRES_USER: ${POS_DB_USER}
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD}
    ports: ["${POS_DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POS_DB_USER} -d $${POS_DB_NAME}"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: platform-rabbitmq
    env_file: [.env]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MGMT_PORT:-15672}:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: platform-kafka
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafka-data:/var/lib/kafka/data]
    restart: unless-stopped

  kafka-ui:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: platform-kafka-ui
    ports: ["${KAFKA_UI_PORT:-9000}:9000"]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on: [kafka]
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.1
    container_name: platform-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["${SPARK_MASTER_UI_PORT:-8081}:8080", "7077:7077"]
    volumes: [spark-work:/opt/spark/work]
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.1
    container_name: platform-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker -m ${SPARK_WORKER_MEMORY:-1G} -c ${SPARK_WORKER_CORES:-1} spark://spark-master:7077
    depends_on: [spark-master]
    restart: unless-stopped

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: version
    depends_on:
      postgres: {condition: service_healthy}

  airflow-apiserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-api
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    command: api-server
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
    container_name: platform-airflow-scheduler
    env_file: [.env]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  pos-api:
    build: ./services/pos-api
    container_name: platform-pos-api
    env_file: [.env]
    environment:
      PYTHONPATH: /opt/domain
      POS_DB_HOST: postgres
    ports: ["${POS_API_PORT:-8001}:8000"]
    volumes: [../data-processing:/opt/domain:ro]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  inventory-api:
    build: ./services/inventory-api
    container_name: platform-inventory-api
    env_file: [.env]
    environment:
      PYTHONPATH: /opt/domain
    ports: ["${INVENTORY_API_PORT:-8002}:8000"]
    volumes: [../data-processing:/opt/domain:ro]
    restart: unless-stopped

  marketplace-api:
    build: ./services/marketplace-api
    container_name: platform-marketplace-api
    env_file: [.env]
    environment:
      PYTHONPATH: /opt/domain
    ports: ["${MARKETPLACE_API_PORT:-8003}:8000"]
    volumes: [../data-processing:/opt/domain:ro]
    restart: unless-stopped

volumes:
  pgdata:
  rabbit-data:
  kafka-data:
  spark-work: