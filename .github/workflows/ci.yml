name: Data Platform CI/CD Pipeline

on:
  push:
    branches: [ "develop", "dev", "main", "feature/*", "feat/*" ]
  pull_request:
    branches: [ "develop", "dev", "main" ]

jobs:
  lint:
    name: Code Style & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff && ruff check services/

  validate-compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null

  validate-dags:
    name: Validate Airflow DAGs Syntax & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest apache-airflow pendulum pika boto3 openpyxl

      - name: Run DAG Integrity & Syntax Tests
        run: |
          pytest tests/test_dags_integrity.py -v

  build:
    name: Build Service Container Images
    runs-on: ubuntu-latest
    needs: [lint, validate-compose, validate-dags]
    steps:
      - uses: actions/checkout@v4
      - run: |
          for svc in pos-api inventory-api marketplace-api; do
            docker build --target builder -t platform/$svc:builder ./services/$svc
            docker build -t platform/$svc:latest ./services/$svc
          done
          docker images 'platform/*' > image-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-sizes
          path: image-sizes.txt

  smoke:
    name: Smoke Integration Health Checks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d postgres rabbitmq kafka inventory-api marketplace-api
      - run: sleep 60 && curl --fail http://localhost:8002/health && curl --fail http://localhost:8003/health
      - run: docker compose down 
        if: always()

  version-data-artifacts:
    name: Version Data Schemas & SQL Artifacts
    runs-on: ubuntu-latest
    needs: [validate-dags]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Schemas and DDLs
        run: |
          mkdir -p dist/data-artifacts
          cp -r postgres/ddl dist/data-artifacts/
          cp -r aws/sql dist/data-artifacts/
          echo '{"commit_sha": "${{ github.sha }}", "ref": "${{ github.ref }}", "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'", "platform": "data-platform"}' > dist/data-artifacts/artifact-manifest.json

      - name: Upload Versioned Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-platform-artifacts-${{ github.sha }}
          path: dist/data-artifacts/
          retention-days: 30
