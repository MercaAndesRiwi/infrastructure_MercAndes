name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff && ruff check services/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null

  build:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    steps:
      - uses: actions/checkout@v4
      - run: |
          for svc in pos-api inventory-api marketplace-api; do
            docker build --target builder -t platform/$svc:builder ./services/$svc
            docker build -t platform/$svc:latest ./services/$svc
          done
          docker images 'platform/*' > image-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-sizes
          path: image-sizes.txt

  smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d postgres rabbitmq kafka inventory-api marketplace-api
      - run: sleep 60 && curl --fail http://localhost:8002/health && curl --fail http://localhost:8003/health
      - run: docker compose down 
        if: always()