name: CI/CD Pipeline - Application & Data Platform

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: mercaandes-ecs-cluster

jobs:
  # ============================================================================
  # 1. SECRET SCANNING
  # ============================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================================
  # 2. CODE LINTING
  # ============================================================================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check services/ --select E,F --ignore E501

  # ============================================================================
  # 3. AUTOMATED TESTS
  # ============================================================================
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config > /dev/null

      - name: Run Operational Messaging Unit Tests
        run: |
          cd services/operational-messaging
          uv run pytest

      - name: Run Promotions API Unit Tests
        run: |
          cd services/f7-weekly-promotions
          uv run pytest

  # ============================================================================
  # 4. BUILD & PUSH TO ECR (7 COMPONENTS)
  # ============================================================================
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Infrastructure Repo
        uses: actions/checkout@v4

      - name: Checkout Marketplace API
        uses: actions/checkout@v4
        with:
          repository: MercaAndesRiwi/Marketplace_Api
          path: Marketplace_Api

      - name: Checkout Inventory API
        uses: actions/checkout@v4
        with:
          repository: MercaAndesRiwi/Inventory_Api
          path: Inventory_Api

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push 7 Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building and publishing 7 platform components to ECR..."

          # 1. Marketplace API (Fargate)
          docker build -t $ECR_REGISTRY/api-orders:latest ./Marketplace_Api
          docker push $ECR_REGISTRY/api-orders:latest

          # 2. Inventory API (Fargate)
          docker build -t $ECR_REGISTRY/api-sellers:latest ./Inventory_Api
          docker push $ECR_REGISTRY/api-sellers:latest

          # 3. Promotions API (Fargate)
          docker build -t $ECR_REGISTRY/api-promotions:latest ./services/f7-weekly-promotions
          docker push $ECR_REGISTRY/api-promotions:latest

          # 4. Airflow (Batch Node)
          docker build -t $ECR_REGISTRY/airflow:latest ./airflow
          docker push $ECR_REGISTRY/airflow:latest

          # 5. Spark (Batch Node)
          docker build -t $ECR_REGISTRY/spark:latest ./docker/spark
          docker push $ECR_REGISTRY/spark:latest

          # 6. Kafka (Streaming Node)
          docker build -t $ECR_REGISTRY/kafka:latest ./docker/kafka
          docker push $ECR_REGISTRY/kafka:latest

          # 7. RabbitMQ (Streaming Node)
          docker build -t $ECR_REGISTRY/rabbitmq:latest ./docker/rabbitmq
          docker push $ECR_REGISTRY/rabbitmq:latest

  # ============================================================================
  # 5. AUTOMATED DEPLOYMENT TO ECS (FARGATE + EC2 TASK DEFINITION UPDATES)
  # ============================================================================
  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Infrastructure Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Deploy APIs to Fargate
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-id.outputs.account_id }}
        run: |
          echo "Deploying 3 APIs to AWS Fargate..."

          # 1. Marketplace API
          sed "s/\${AWS_ACCOUNT_ID}/$AWS_ACCOUNT_ID/g" aws/task-definitions/marketplace-api-task.json > /tmp/marketplace.json
          aws ecs register-task-definition --cli-input-json file:///tmp/marketplace.json
          aws ecs update-service --cluster $ECS_CLUSTER --service mercaandes-marketplace-api --task-definition mercaandes-marketplace-api --force-new-deployment || echo "Marketplace service will be started once cluster service is instantiated"

          # 2. Inventory API
          sed "s/\${AWS_ACCOUNT_ID}/$AWS_ACCOUNT_ID/g" aws/task-definitions/inventory-api-task.json > /tmp/inventory.json
          aws ecs register-task-definition --cli-input-json file:///tmp/inventory.json
          aws ecs update-service --cluster $ECS_CLUSTER --service mercaandes-inventory-api --task-definition mercaandes-inventory-api --force-new-deployment || echo "Inventory service will be started once cluster service is instantiated"

          # 3. Promotions API
          sed "s/\${AWS_ACCOUNT_ID}/$AWS_ACCOUNT_ID/g" aws/task-definitions/promotions-api-task.json > /tmp/promotions.json
          aws ecs register-task-definition --cli-input-json file:///tmp/promotions.json
          aws ecs update-service --cluster $ECS_CLUSTER --service mercaandes-promotions-api --task-definition mercaandes-promotions-api --force-new-deployment || echo "Promotions service will be started once cluster service is instantiated"

      - name: Update Batch & Streaming Node Task Definitions (EC2)
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-id.outputs.account_id }}
        run: |
          echo "Updating EC2 Task Definitions for Batch Node and Streaming Node..."

          # Batch Node (Airflow + Spark)
          sed "s/\${AWS_ACCOUNT_ID}/$AWS_ACCOUNT_ID/g" aws/task-definitions/batch-node-task.json > /tmp/batch.json
          aws ecs register-task-definition --cli-input-json file:///tmp/batch.json

          # Streaming Node (Kafka + RabbitMQ)
          sed "s/\${AWS_ACCOUNT_ID}/$AWS_ACCOUNT_ID/g" aws/task-definitions/streaming-node-task.json > /tmp/streaming.json
          aws ecs register-task-definition --cli-input-json file:///tmp/streaming.json
